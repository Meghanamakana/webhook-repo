<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techstax GitHub Events Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 GitHub Events Dashboard - Techstax Assignment</h1>
            <div class="stats">
                <span id="lastRefresh">Last refresh: Never</span>
                <span id="eventCount">0 events</span>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="repoInput" placeholder="owner/repo (e.g., octocat/Hello-World)" value="octocat/Hello-World">
            <button onclick="fetchEvents()">🔄 Refresh (30s auto)</button>
            <button onclick="clearEvents()">🗑️ Clear</button>
        </div>

        <div id="eventsContainer">
            <div class="no-events">👈 Enter repo above and click Refresh</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
