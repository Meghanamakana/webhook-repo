<!DOCTYPE html>
<html>
<head>
    <title>Techstax - GitHub Events Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #333; text-align: center; }
        .controls { margin: 20px 0; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; }
        .event { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .time { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Techstax GitHub Events Dashboard</h1>
        <div class="controls">
            <input type="text" id="repoInput" value="octocat/Hello-World" placeholder="owner/repo">
            <button onclick="fetchEvents()">🔄 Refresh Events (30s auto)</button>
            <button onclick="clearCache()">🗑️ Clear Cache</button>
        </div>
        
        <div>Last refresh: <span id="lastRefresh">--</span></div>
        <div id="eventsContainer">
            {% if events %}
                {% for event in events %}
                <div class="event">
                    <strong>{{ event.type }}</strong> by @{{ event.actor.login }}<br>
                    <span class="time">{{ event.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</span>
                    <div>{{ event.payload|tojson }}</div>
                </div>
                {% endfor %}
            {% else %}
                <p>No recent events. Enter repo and refresh.</p>
            {% endif %}
        </div>
    </div>

    <script>
        let refreshInterval;
        
        function fetchEvents() {
            const repo = document.getElementById('repoInput').value;
            document.getElementById('eventsContainer').innerHTML = '<p>🔄 Loading...</p>';
            
            fetch(`/api/events?repo=${repo}`)
                .then(r => r.json())
                .then(events => {
                    document.getElementById('lastRefresh').textContent = new Date().toLocaleString();
                    location.reload(); // Refresh to show MongoDB data
                });
        }
        
        function clearCache() {
            fetch('/clear').then(() => location.reload());
        }
        
        // Auto-refresh every 30 seconds
        setInterval(fetchEvents, 30000);
        fetchEvents();
    </script>
</body>
</html>
